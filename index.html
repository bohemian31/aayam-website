<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The House of Aayam — Launching Soon</title>
  <meta name="description" content="Adding a new dimension to men's expression. The House of Aayam launches Monday, 28 September.">
  <meta name="theme-color" content="#faf7f2">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The House of Aayam — Launching Soon">
  <meta property="og:description" content="Adding a new dimension to men's expression. Launching Monday, 28 September.">
  <meta property="og:image" content="https://thehouseofaayam.com/assets/hero.jpg">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="content">
      <img class="logo" src="assets/logo.png" alt="The House of Aayam" width="881" height="507">

      <p class="eyebrow">Launching Monday, 28 September &middot; 8:00 AM IST</p>

      <h1>Adding a new dimension to <em>men's expression.</em></h1>
      <p class="sub">Fine jewellery, considered in every detail.</p>

      <div class="rule" aria-hidden="true"></div>

      <div class="countdown" role="timer" aria-live="off" aria-label="Time remaining until launch">
        <div class="unit"><span class="num" id="days">00</span><span class="label">Days</span></div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="unit"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="unit"><span class="num" id="minutes">00</span><span class="label">Minutes</span></div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="unit"><span class="num" id="seconds">00</span><span class="label">Seconds</span></div>
      </div>

      <p class="foot">&copy; 2026 The House of Aayam</p>
    </section>

    <aside class="visual" aria-hidden="true">
      <div class="frame"><img src="assets/hero.jpg" alt=""></div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
